<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="Concert photography. Live music / Afrobeats / the stage." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body class="home-body" data-root="">

  <nav class="nav-mobile" id="mobile-nav" aria-label="Mobile"></nav>

        <p class="label">Selected work</p>
        <p class="big" id="cap-name">Wizkid</p>

    </aside>

  <p class="home-foot"><a href="https://www.instagram.com/larissaumulinga/">@larissaumulinga</a></p>
