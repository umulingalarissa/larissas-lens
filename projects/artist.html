<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Larissa Umulinga — Concert Photography</title>
  <meta name="description" content="Concert photography by Larissa Umulinga." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif:ital@1&family=Inter+Tight:wght@400;500;600&family=Poppins:wght@300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body data-root="../">
  <header class="site-header" id="site-header"></header>
  <nav class="nav-mobile" id="mobile-nav" aria-label="Mobile"></nav>
  <div class="page-wrap has-footer-space">
  <main>
    <section class="artist-hero">
      <div class="artist-hero-bg">
        <img alt="" fetchpriority="high" />
      </div>
      <div class="artist-hero-shade"></div>
      <div class="artist-hero-copy">
        <p class="artist-num"></p>
        <h1 class="artist-name"></h1>
        <p class="artist-credit"></p>
      </div>
    </section>
    <p class="page-lede" style="max-width:var(--max);margin:1.5rem auto 0;padding:0 var(--safe);"></p>
    <section class="gallery" aria-label="Gallery"></section>
    <nav class="artist-nav" aria-label="Adjacent work"></nav>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  </div>
  <script src="artists-data.js"></script>
  <script src="../site.js"></script>
</body>
</html>
